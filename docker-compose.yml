services:
  mangatvl-api:
    build:
      context: .
      dockerfile: Dockerfile.gpu        # CPU image (default). Use Dockerfile.gpu for CUDA.
    image: mangatvl-api
    ports:
      - "8000:8000"
    env_file:
      - .env                        # provider key(s) + DEVICE/PROVIDER/MODEL/CONCURRENT_REQUESTS
    restart: unless-stopped

    # --- GPU: switch dockerfile to Dockerfile.gpu, set DEVICE=cuda, and uncomment below ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
